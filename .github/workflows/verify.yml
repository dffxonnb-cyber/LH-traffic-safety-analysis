name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docs-and-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Rebuild public portfolio evidence
        run: python scripts/build_portfolio_evidence.py

      - name: Run public-safe dashboard smoke tests
        run: python -m unittest discover -s tests -p "test_*.py"
